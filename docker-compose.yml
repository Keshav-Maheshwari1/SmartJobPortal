version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/portal-app/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /opt/portal-app/frontend/build:/usr/share/nginx/html
      - /opt/portal-app/letsencrypt:/etc/letsencrypt
    depends_on:
      - portal
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100m

  portal:
    build:
      context: ./portal
    container_name: portal-app
    ports:
      - "9000:9000"
    env_file:
      - /opt/portal-app/portal/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300m

  backend:
    build:
      context: ./backend
    container_name: express-app
    ports:
      - "5000:5000"
    env_file:
      - /opt/portal-app/backend/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 150m
